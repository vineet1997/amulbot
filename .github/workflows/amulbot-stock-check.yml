name: AmulBot stock check

on:
  repository_dispatch:
    types: [amulbot_stock_check]
  workflow_dispatch:

concurrency:
  group: amulbot-stock-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node src/github-worker.js
        env:
          AMULBOT_PINCODES: ${{ secrets.AMULBOT_PINCODES }}
          AMULBOT_RECORD_URL: ${{ secrets.AMULBOT_RECORD_URL }}
          AMULBOT_WORKER_SECRET: ${{ secrets.AMULBOT_WORKER_SECRET }}
